<svg xmlns="http://www.w3.org/2000/svg" width="730" height="411" viewBox="0 0 730 411" role="img" aria-label="Пример будущей диагностики" font-family="system-ui, sans-serif"><title>Пример будущей диагностики</title><desc>Концепт сообщения об ошибке, а не фактический вывод Cvolo.</desc><rect x="1" y="1" width="728" height="409" rx="12" fill="#ffffff" fill-opacity="1" stroke="#d4d4d8" stroke-opacity="1"/><text x="24" y="34" font-size="18" font-weight="600" text-anchor="start" fill="#27272a">Пример будущей диагностики</text><rect x="40" y="60" width="650" height="296" rx="8" fill="#71717a" fill-opacity="0.08" stroke="#71717a" stroke-opacity="1" stroke-width="1.5"/><text x="365" y="95" font-size="17" font-weight="600" text-anchor="middle" fill="#ef4444">Packet payload must not exceed</text><text x="365" y="118" font-size="17" font-weight="600" text-anchor="middle" fill="#ef4444">1024 bytes</text><rect x="65" y="142" width="600" height="88" rx="8" fill="#71717a" fill-opacity="0.05" stroke="#71717a" stroke-opacity="0" stroke-width="1.5"/><text x="365" y="170" font-size="14" font-weight="600" text-anchor="middle" fill="#27272a" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" xml:space="preserve">main.cvl:42:9</text><text x="365" y="190" font-size="14" font-weight="600" text-anchor="middle" fill="#27272a" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" xml:space="preserve">var Packet&lt;LargeData&gt; packet;</text><text x="365" y="210" font-size="14" font-weight="600" text-anchor="middle" fill="#27272a" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" xml:space="preserve">^^^^^^^^^^^^^^^^^^^^^</text><path d="M65 254 H665" stroke="#d4d4d8" stroke-width="1"/><text x="365" y="292" font-size="14" font-weight="400" text-anchor="middle" fill="#52525b">Actual payload size: 2048 bytes</text><text x="365" y="312" font-size="14" font-weight="400" text-anchor="middle" fill="#52525b">Required maximum: 1024 bytes</text><text x="365" y="332" font-size="14" font-weight="400" text-anchor="middle" fill="#52525b">Constraint declared in Packet.cvl:6</text><text x="24" y="393" font-size="13" font-weight="400" text-anchor="start" fill="#52525b">Концепт сообщения об ошибке, а не фактический вывод Cvolo.</text></svg>
