<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#15151a" />
    <link rel="icon" type="image/png" href="%sveltekit.assets%/brand/cvolo-logo.png" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/brand/cvolo-logo.png" />
    <script>
      try {
        const saved = localStorage.getItem('cvolo-docs-theme');
        const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
      } catch {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
